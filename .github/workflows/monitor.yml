name: YouTube Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: youtube-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      # ดึง state.json จาก Cache ของรอบก่อนหน้า
      - name: Restore State Cache
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: yt-state-${{ github.run_id }}
          restore-keys: |
            yt-state-

      - name: Run YouTube monitor
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_A: ${{ secrets.DISCORD_WEBHOOK_A }}
          DISCORD_WEBHOOK_B: ${{ secrets.DISCORD_WEBHOOK_B }}
        run: python monitor.py

      # เซฟ state.json กลับเข้า Cache สำหรับรอบถัดไป
      - name: Save State Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: yt-state-${{ github.run_id }}